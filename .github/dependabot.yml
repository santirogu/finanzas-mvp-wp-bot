# Dependabot abre PRs para actualizar dependencias. Las alertas y los PRs de seguridad se activan
# aparte, en Settings → Code security. Los títulos siguen Conventional Commits:
#   chore(deps): …  /  chore(deps-dev): …  /  ci(deps): …
# Ojo: Dependabot decide si escribe "Bump" o "bump" copiando su último commit en main. Si un PR
# llega con "Bump", el check "Título del PR" falla: edita el título a "bump" antes del merge.
version: 2
updates:
  - package-ecosystem: npm # incluye pnpm (lee pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencias]
    ignore:
      # Los tipos de Node deben coincidir con el Node que corre la app (22, el del CI): con los de
      # una versión mayor, el typecheck aceptaría APIs que no existen en ese Node.
      # Al subir de versión de Node, actualiza @types/node a mano en el mismo PR.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Espera 7 días desde que sale una versión: los paquetes secuestrados suelen detectarse y
    # retirarse en esos primeros días. No aplica a las actualizaciones de seguridad.
    cooldown:
      default-days: 7
    groups:
      # Las versiones menores y parches van juntas en un solo PR; las mayores, por separado.
      menores-y-parches:
        update-types: [minor, patch]

  # El CLI de Vercel del job de despliegue (.github/vercel-cli/), con su propio lockfile.
  - package-ecosystem: npm
    directory: /.github/vercel-cli
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencias]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Bogota
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencias]
    # Las acciones van fijadas por SHA (con la versión en un comentario): Dependabot actualiza los dos.
    cooldown:
      default-days: 7
    groups:
      acciones:
        patterns: ["*"]
