name: Pull request

# Validaciones del PR (ver CLAUDE.md). Corren también al editar el PR, así que basta con
# corregir el título o la descripción para que se vuelvan a ejecutar.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Menor privilegio: el token del CI solo puede leer el código (los jobs que necesitan más
# permisos los declaran por su cuenta).
permissions:
  contents: read

jobs:
  # Con "squash and merge", el título del PR se convierte en el commit de main:
  # validarlo garantiza que todo el historial siga Conventional Commits.
  pr-title:
    name: Título del PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Validar Conventional Commits
        env:
          # Se pasa por variable de entorno para no interpolar texto del PR dentro del script.
          TITLE: ${{ github.event.pull_request.title }}
          # Dependabot nombra los paquetes completos: se le permite un título más largo.
          MAX_LENGTH: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '120' || '72' }}
        run: node scripts/conventional-commit.mjs --max-length "$MAX_LENGTH" "$TITLE"

  # La descripción debe seguir .github/pull_request_template.md: Why / What / How.
  pr-description:
    name: Descripción del PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Validar Why / What / How
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | node scripts/pr-description.mjs

      # Los PRs de Dependabot traen su propia descripción (changelog y notas de la versión).
      - name: PR de Dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "PR automático de Dependabot; su descripción la genera el bot."
