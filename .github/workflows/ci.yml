name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Botón "Run workflow" en Actions: corre los checks y despliega siempre (por ejemplo,
  # después de cambiar variables de entorno en Vercel). Solo desde main.
  workflow_dispatch:

# En PRs, un push nuevo cancela la corrida anterior. En main nunca se cancela:
# podría cortar un despliegue a mitad de una migración.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Menor privilegio: el token del CI solo puede leer el código (los jobs que necesitan más
# permisos los declaran por su cuenta).
permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://finanzas:finanzas@localhost:5432/finanzas_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Falla ante vulnerabilidades altas o críticas en dependencias de producción. Las de
      # desarrollo las vigila Dependabot (algunas no tienen versión corregida y bloquearían todo).
      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      # Falla si src/db/schema/ cambió sin su migración en drizzle/ (no necesita base de datos).
      - name: Migraciones al día (schema drift)
        run: pnpm db:check-drift

      - name: Pruebas unitarias y de integración con cobertura
        run: pnpm test:coverage

      - name: Resumen de cobertura
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "coverage/coverage-summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const t = JSON.parse(fs.readFileSync(file, "utf8")).total;
            const row = (k, label) => `| ${label} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            const md = ["### Cobertura", "", "| Métrica | % | Cubierto |", "|---|---|---|",
              row("lines", "Líneas"), row("statements", "Sentencias"),
              row("functions", "Funciones"), row("branches", "Ramas")].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Pruebas de punta a punta: un navegador real (Playwright) recorre la app como un usuario, en
  # escritorio y en celular, y axe-core revisa la accesibilidad. Corre contra un build de
  # producción local con su propio Postgres; no llama a Claude ni a WhatsApp. Check obligatorio.
  e2e:
    name: E2E y accesibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Las E2E usan la base finanzas_e2e_test de este mismo servidor (ver e2e/database-url.ts).
      TEST_DATABASE_URL: postgres://finanzas:finanzas@localhost:5432/finanzas_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # El navegador se guarda en caché por versión de Playwright (cambia con pnpm-lock.yaml).
      - name: Caché del navegador de Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Compilar la app
        env:
          DATABASE_URL: postgres://finanzas:finanzas@localhost:5432/finanzas_e2e_test
        run: pnpm build

      - name: Pruebas E2E y de accesibilidad
        env:
          E2E_SKIP_BUILD: "1"
        run: pnpm test:e2e

      # Con capturas y trazas de las pruebas que fallaron: pnpm exec playwright show-trace <zip>.
      - name: Guardar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Escaneo de seguridad dinámico (DAST) con OWASP ZAP: recorre el build de producción local y
  # analiza cada respuesta en busca de cabeceras faltantes, cookies inseguras y fugas de
  # información. Es pasivo (no ataca la app). Las reglas que bloquean están en .zap/rules.tsv.
  dast:
    name: Escaneo de seguridad (ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://finanzas:finanzas@localhost:5432/finanzas_test
      BETTER_AUTH_SECRET: zap-secreto-solo-para-pruebas-no-usar-en-produccion
      BETTER_AUTH_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Preparar la base
        run: pnpm db:setup

      - name: Compilar y levantar la app
        run: |
          pnpm build
          nohup pnpm exec next start -p 3100 > next.log 2>&1 &
          for i in $(seq 60); do
            curl -sf http://localhost:3100/login > /dev/null && exit 0
            sleep 1
          done
          echo "::error::La app no respondió en 60 segundos"; cat next.log; exit 1

      # zap-baseline.py: araña la app 2 minutos y aplica las reglas pasivas. -I: las advertencias
      # no fallan; solo las reglas en FAIL. La imagen va fijada por digest (ZAP 2.17.0).
      - name: Escaneo pasivo con OWASP ZAP
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            zaproxy/zap-stable@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2 \
            zap-baseline.py -t http://localhost:3100 -c rules.tsv -m 2 -I \
              -r reporte.html -J reporte.json -w reporte.md

      - name: Resumen del escaneo
        if: always()
        run: |
          if [ -f zap/reporte.md ]; then cat zap/reporte.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Guardar reporte de ZAP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap/
          retention-days: 14

  # Convención de ramas (ver CLAUDE.md). Es un check obligatorio para fusionar PRs.
  branch-name:
    name: Nombre de rama
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar <tipo>/<descripcion-corta>
        env:
          # Se pasa por variable de entorno para no interpolar texto del PR dentro del script.
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "Rama de Dependabot: permitida."
            exit 0
          fi
          pattern='^(feature|fix|hotfix|refactor|test|docs|chore|ci)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "✓ '$BRANCH' sigue la convención."
            exit 0
          fi
          echo "::error::La rama '$BRANCH' no sigue la convención <tipo>/<descripcion-corta>."
          echo "Tipos: feature, fix, hotfix, refactor, test, docs, chore, ci."
          echo "Solo minúsculas, números y guiones simples. Ejemplo: feature/notas-de-voz"
          exit 1

  # Decide si hace falta desplegar comparando con el último commit desplegado con éxito
  # (no con el commit anterior: si un despliegue falló, sus cambios siguen pendientes).
  changes:
    name: Detectar cambios de la app
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decidir si desplegar
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Despliegue manual: se despliega."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Último despliegue a producción cuyo estado final fue "success".
          last=""
          for id in $(gh api "repos/${{ github.repository }}/deployments?environment=production&per_page=30" --jq '.[].id'); do
            state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state')
            if [ "$state" = "success" ]; then
              last=$(gh api "repos/${{ github.repository }}/deployments/$id" --jq '.sha')
              break
            fi
          done

          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "No se encontró el último despliegue en el historial: se despliega por seguridad."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Último despliegue exitoso: $last"
          git diff --name-only "$last" "${{ github.sha }}" | tee changed.txt | node scripts/deploy-needed.mjs | tee decision.txt
          { echo "### ¿Desplegar a producción?"; echo; echo '```'; cat decision.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Solo se despliega si las pruebas pasaron y hubo cambios que afectan la app, y solo desde main.
  # Vercel no despliega por su cuenta (vercel.json → git.deploymentEnabled: false),
  # así que ni el código ni las migraciones llegan a producción sin pasar el CI.
  deploy:
    name: Desplegar a producción
    needs: [checks, e2e, dast, changes]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Registra cada publicación en el entorno "production": es el historial que usa el job
    # "Detectar cambios de la app" para saber qué fue lo último desplegado.
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://finanzas-mvp-wp-bot.vercel.app
    # Un despliegue a la vez; uno nuevo espera a que termine el anterior (no lo cancela a mitad).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_URL: https://finanzas-mvp-wp-bot.vercel.app

    # Publicar sin tráfico → smoke tests → pasarle el dominio → smoke tests → (si fallan) volver a
    # la versión anterior. Ojo: las migraciones corren en el build y no se deshacen; por eso deben
    # ser compatibles con la versión anterior del código (ver CLAUDE.md).
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Antes de migrar: si falta algo, mejor fallar aquí que con la base ya migrada.
      - name: Verificar credenciales de Vercel
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secreto $name en GitHub"; exit 1; fi
          done

      - name: Descargar configuración y variables de producción
        run: pnpm dlx vercel@61.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Ejecuta `pnpm vercel-build`: migraciones + categorías + build de Next.js.
      - name: Migrar base de datos y compilar
        run: pnpm dlx vercel@61.1.0 build --prod --token="$VERCEL_TOKEN"

      # --skip-domain: la versión nueva queda publicada en su propia URL, sin recibir tráfico.
      - name: Publicar sin dominio
        id: publicar
        run: |
          url=$(pnpm dlx vercel@61.1.0 deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "Versión nueva, todavía sin tráfico: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke tests de la versión nueva (sin tráfico)
        env:
          NUEVA: ${{ steps.publicar.outputs.url }}
          # Llave de "Protection Bypass for Automation" (Vercel → Settings → Deployment
          # Protection): la URL propia de cada versión está protegida; el dominio, no.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke.mjs "$NUEVA"

      # La que hoy sirve el dominio: es a la que se vuelve si algo falla después del cambio.
      - name: Anotar la versión actual de producción
        id: anterior
        run: |
          id=$(pnpm dlx vercel@61.1.0 inspect "$PRODUCTION_URL" --json --token="$VERCEL_TOKEN" | jq -er '.id')
          echo "Versión actual de producción: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Pasarle el dominio a la versión nueva
        id: promover
        env:
          NUEVA: ${{ steps.publicar.outputs.url }}
        run: pnpm dlx vercel@61.1.0 promote "$NUEVA" --timeout=5m --token="$VERCEL_TOKEN"

      - name: Smoke tests en el dominio de producción
        run: node scripts/smoke.mjs "$PRODUCTION_URL"

      # Solo si se alcanzó a intentar el cambio de dominio (si falló antes, el dominio sigue en la
      # versión anterior y no hay nada que deshacer).
      - name: Volver a la versión anterior
        if: failure() && (steps.promover.outcome == 'success' || steps.promover.outcome == 'failure')
        env:
          ANTERIOR: ${{ steps.anterior.outputs.id }}
        run: |
          echo "::error::La versión nueva falló en producción: volviendo a la anterior ($ANTERIOR)."
          pnpm dlx vercel@61.1.0 rollback "$ANTERIOR" --timeout=5m --token="$VERCEL_TOKEN"
          node scripts/smoke.mjs "$PRODUCTION_URL" || echo "::error::La versión anterior tampoco pasa los smoke tests: revisa Vercel."


  # Cada despliegue a producción exitoso queda como una release de GitHub (v1.0.0, v1.1.0, …),
  # con la versión calculada de los Conventional Commits y las notas agrupadas por tipo.
  # Los cambios que no despliegan (docs, CI, pruebas) entran en la release del siguiente despliegue.
  release:
    name: Publicar release
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Crear la release también crea su tag.
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # Con todo el historial y los tags: la versión nueva se calcula desde la última release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Calcular la versión y las notas
        id: version
        run: node scripts/release.mjs --notes release-notes.md

      - name: Publicar la release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
          { echo "### Release $TAG"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
