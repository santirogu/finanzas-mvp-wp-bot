name: Mutation testing

# Stryker introduce cambios pequeños en el código y verifica que las pruebas unitarias los
# detecten. Tarda ~40 minutos en GitHub, así que corre solo a pedido (no es check obligatorio):
#   · en un PR, al ponerle la etiqueta "mutation-testing" (y en cada push mientras la tenga);
#   · a mano: Actions → Mutation testing → Run workflow;
#   · cada lunes sobre main, para detectar si el puntaje fue bajando.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1" # lunes 6:00 a. m. en Bogotá (11:00 UTC)

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

# Menor privilegio: el token del CI solo puede leer el código (los jobs que necesitan más
# permisos los declaran por su cuenta).
permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing
    # En PRs, solo si tienen la etiqueta. Al agregar otra etiqueta no se vuelve a correr.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'mutation-testing') ||
      (github.event.action != 'labeled' &&
        contains(github.event.pull_request.labels.*.name, 'mutation-testing'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Falla si el puntaje queda por debajo de "break" en stryker.config.mjs.
      - name: Ejecutar Stryker
        run: pnpm test:mutation

      - name: Resumen del puntaje
        if: always()
        run: node scripts/mutation-summary.mjs

      - name: Guardar reporte HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
