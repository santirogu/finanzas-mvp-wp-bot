name: Mutation testing

# Stryker introduce cambios pequeños en el código y verifica que las pruebas unitarias los
# detecten. Cada mutante corre la suite unitaria completa: la lista entera de stryker.config.mjs
# (~5000 mutantes) tarda ~8 horas en un runner, más de lo que dura un job. Por eso
# (scripts/mutation-targets.mjs):
#   · en un PR con la etiqueta "mutation-testing" (y en cada push mientras la tenga) se mutan solo
#     los archivos de esa lista que el PR cambió, y los que agrega a la lista: unos minutos;
#   · cada lunes sobre main y a mano (Actions → Mutation testing → Run workflow), la lista completa,
#     repartida en hasta 12 partes que corren a la vez (70–92 minutos cada una en octubre de 2026).
# No es check obligatorio.
on:
  pull_request:
    # closed: al cerrar o fusionar el PR, la corrida que quede se cancela (ver la concurrencia).
    types: [labeled, synchronize, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1" # lunes 6:00 a. m. en Bogotá (11:00 UTC)

concurrency:
  # Una corrida por PR: un push nuevo o el cierre del PR cancelan la anterior. Ponerle otra etiqueta
  # no la corta: esa corrida (que no hace nada) va en un grupo propio.
  group: mutation-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'mutation-testing' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

# Menor privilegio: el token del CI solo puede leer el código (los jobs que necesitan más
# permisos los declaran por su cuenta).
permissions:
  contents: read

jobs:
  targets:
    name: Qué mutar
    # En PRs, solo si tienen la etiqueta (y no al cerrarlos). Al agregar otra etiqueta no se vuelve a correr.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'mutation-testing') ||
      (github.event.action != 'labeled' && github.event.action != 'closed' &&
        contains(github.event.pull_request.labels.*.name, 'mutation-testing'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.decide.outputs.count }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin el token de GitHub en .git/config mientras corre código de terceros.
          persist-credentials: false
          fetch-depth: 0

      # El script solo usa Node (lee stryker.config.mjs): no hace falta instalar dependencias.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Decidir qué archivos mutar
        id: decide
        env:
          # También para ver qué archivos entran a la lista, si el PR cambia stryker.config.mjs.
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Si el script falla, el paso también (y no corre una matriz vacía).
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            node scripts/mutation-targets.mjs todos | tee decision.txt
          # GITHUB_SHA es el PR fusionado con la base: el diff son los cambios del PR.
          elif git diff --name-only "$BASE" "$GITHUB_SHA" > changed.txt; then
            node scripts/mutation-targets.mjs cambios < changed.txt | tee decision.txt
          else
            echo "No se pudo comparar con la base: se muta la lista completa." | tee decision.txt
            node scripts/mutation-targets.mjs todos | tee -a decision.txt
          fi
          { echo "### ¿Qué muta Stryker?"; echo; echo '```'; cat decision.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  mutation:
    name: Mutation testing (${{ matrix.parte }})
    needs: targets
    if: needs.targets.outputs.count != '0'
    strategy:
      # Si una parte falla, las otras terminan igual: así se ve el puntaje de todas.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Con el tope de 12 partes (MAX_SHARDS), cada una lleva ~1/12 del código: en octubre de 2026, 70–92 min. Con
    # 150 hay margen para que el código crezca (~60 %) sin que las partes se corten (README → Pruebas y CI).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin el token de GitHub en .git/config mientras corre código de terceros.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Los archivos de esta parte, por una variable (no escritos en el comando): son nombres que
      # vienen del PR. Falla si el puntaje queda por debajo de "break" en stryker.config.mjs.
      - name: Ejecutar Stryker
        env:
          FILES: ${{ matrix.files }}
        run: pnpm exec stryker run --mutate "$FILES"

      # Si la subida falla (GitHub a veces responde ETIMEDOUT), la parte no queda en falla por eso: su
      # puntaje ya lo decidió Stryker. El resumen avisa que falta su reporte.
      - name: Guardar reporte
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: reports/mutation/
          retention-days: 14

  resumen:
    name: Resumen del puntaje
    needs: [targets, mutation]
    # También si una parte falló (el resumen dice dónde); no si no hubo nada que mutar.
    if: always() && needs.targets.result == 'success' && needs.targets.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin el token de GitHub en .git/config mientras corre código de terceros.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Si no llegó ninguno, la descarga falla: el resumen igual corre y dice cuáles faltan.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: mutation-report-*
          path: partes

      # Los reportes de todas las partes, juntos en una tabla (el puntaje total y por archivo). Se le pasa
      # el de cada parte de la matriz, también los que no llegaron: así el resumen dice cuál falta en vez
      # de mostrar el puntaje como si estuviera completo.
      - name: Juntar los reportes
        env:
          MATRIX: ${{ needs.targets.outputs.matrix }}
        run: |
          set -o pipefail
          PARTS=$(node -e 'console.log(JSON.parse(process.env.MATRIX).length)')
          node scripts/mutation-summary.mjs $(seq -f "partes/mutation-report-%g/mutation.json" 0 $((PARTS - 1)))
