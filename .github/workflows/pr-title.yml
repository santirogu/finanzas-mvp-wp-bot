name: Título del PR

# Con "squash and merge", el título del PR se convierte en el commit de main:
# validarlo garantiza que todo el historial siga Conventional Commits (ver CLAUDE.md).
# Corre también al editar el PR, para revalidar si se corrige el título.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: Título del PR
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Validar Conventional Commits
        env:
          # Se pasa por variable de entorno para no interpolar texto del PR dentro del script.
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/conventional-commit.mjs "$TITLE"
