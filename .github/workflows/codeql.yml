name: CodeQL

# Análisis estático de seguridad (SAST) de GitHub. Busca vulnerabilidades en el código
# TypeScript (inyecciones, XSS, secretos expuestos, validaciones débiles…) y en los workflows de
# GitHub Actions (p. ej. interpolar texto de un PR dentro de un script). La regla "Proteger main"
# bloquea el merge si un PR introduce alertas de severidad alta o crítica.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 3" # miércoles 7:00 a. m. en Bogotá: detecta vulnerabilidades nuevas en código viejo

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin el token de GitHub en .git/config mientras corre código de terceros.
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Reglas de seguridad ampliadas (más que el conjunto por defecto).
          queries: security-extended

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
